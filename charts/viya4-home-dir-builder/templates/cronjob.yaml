apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "viya4-home-dir-builder.fullname" . }}
  labels:
    {{- include "viya4-home-dir-builder.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  suspend: {{ .Values.suspend }}
  jobTemplate:
    metadata:
      labels:
        {{- include "viya4-home-dir-builder.labels" . | nindent 8 }}
    spec:
      template:
        metadata:
          labels:
            {{- include "viya4-home-dir-builder.selectorLabels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          serviceAccountName: {{ include "viya4-home-dir-builder.serviceAccountName" . }}
          volumes:
            - name: nfs-root
              nfs:
                server: {{ .Values.nfs.server }}
                path: /
            - name: userhome
              nfs:
                server: {{ .Values.nfs.server }}
                path: {{ .Values.nfs.mount }}
            - name: scripts
              configMap:
                name: {{ include "viya4-home-dir-builder.fullname" . }}-py
            - name: pip-packages
              emptyDir: {}
          initContainers:
            - name: ensure-home-dir
              image: busybox:1.37
              command: ['sh', '-c', 'mkdir -p /nfs{{ .Values.nfs.mount }}']
              volumeMounts:
                - name: nfs-root
                  mountPath: /nfs
            - name: install-deps
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              command: ['pip', 'install', '--quiet', '--target', '/pip-packages', 'requests']
              volumeMounts:
                - name: pip-packages
                  mountPath: /pip-packages
          containers:
            - name: home-dir-builder
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "/scripts/home_dir_builder.py"]
              env:
                - name: PYTHONPATH
                  value: /pip-packages
              envFrom:
                - secretRef:
                    name: {{ .Values.viya.consulSecretName | default "sas-consul-client" }}
                - secretRef:
                    name: {{ include "viya4-home-dir-builder.fullname" . }}
                - configMapRef:
                    name: {{ include "viya4-home-dir-builder.fullname" . }}
              volumeMounts:
                - name: userhome
                  mountPath: {{ .Values.viya.homeDirLocation }}
                - name: scripts
                  mountPath: /scripts
                - name: pip-packages
                  mountPath: /pip-packages
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          restartPolicy: Never
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 8 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 8 }}
          {{- end }}
      backoffLimit: 4
