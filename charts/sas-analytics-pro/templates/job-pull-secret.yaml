{{- if and .Values.sas.orderCertFile (not .Values.sas.registryPass) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sas-analytics-pro.fullname" . }}-pull-secret-job
  labels:
    {{- include "sas-analytics-pro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "sas-analytics-pro.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sas-analytics-pro.fullname" . }}-pull-secret-sa
      restartPolicy: Never
      volumes:
        - name: certs
          secret:
            secretName: {{ include "sas-analytics-pro.fullname" . }}-hook-certs
            defaultMode: 0644
      containers:
        - name: create-pull-secret
          image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Installing dependencies..."
              apk add --no-cache curl unzip || { echo "ERROR: apk add failed"; exit 1; }

              echo "Checking certs.zip..."
              ls -la /certs/certs.zip
              file /certs/certs.zip 2>/dev/null || true

              # Extract certs from zip
              mkdir -p /tmp/certs
              unzip -qo /certs/certs.zip -d /tmp/certs || { echo "ERROR: unzip failed"; exit 1; }

              CERT_FILE=$(find /tmp/certs -name "entitlement_certificate.pem" -type f | head -1)
              CA_FILE=$(find /tmp/certs -name "SAS_CA_Certificate.pem" -type f | head -1)

              if [ -z "$CERT_FILE" ] || [ -z "$CA_FILE" ]; then
                echo "ERROR: Could not find certificate files in certs.zip"
                find /tmp/certs -type f
                exit 1
              fi
              echo "Found cert: $CERT_FILE"
              echo "Found CA: $CA_FILE"

              # Call SES API to get entitlements (includes registry credentials)
              echo "Calling SES API for entitlements..."
              RESPONSE=$(curl -s --cert "$CERT_FILE" --cacert "$CA_FILE" \
                "https://ses.sas.download/ses/entitlements.json")
              CURL_RC=$?

              if [ $CURL_RC -ne 0 ] || [ -z "$RESPONSE" ]; then
                echo "ERROR: Failed to get entitlements from SES API (curl exit code: $CURL_RC)"
                echo "Response: $RESPONSE"
                exit 1
              fi
              echo "SES API call successful"

              # Extract registry username and password from JSON response
              REG_USER=$(echo "$RESPONSE" | sed -n 's/.*"username" *: *"\([^"]*\)".*/\1/p' | head -1)
              REG_PASS=$(echo "$RESPONSE" | sed -n 's/.*"password" *: *"\([^"]*\)".*/\1/p' | head -1)

              if [ -z "$REG_USER" ] || [ -z "$REG_PASS" ]; then
                echo "ERROR: Could not extract registry credentials from SES API response"
                exit 1
              fi
              echo "Got registry credentials for user: $REG_USER"

              # Resolve latest stable image tag if no tag was specified
              IMAGE_TAG="{{ .Values.image.tag }}"
              if [ -z "$IMAGE_TAG" ]; then
                echo "No image tag specified, resolving latest stable from SES API..."
                SHIPPED=$(curl -s --cert "$CERT_FILE" --cacert "$CA_FILE" \
                  "https://ses.sas.download/ses/cadences/shipped.mc")
                if [ -n "$SHIPPED" ]; then
                  CADENCE_NAME="{{ .Values.sas.cadenceName }}"
                  CADENCE_VERSION="{{ .Values.sas.cadenceVersion }}"

                  if [ -z "$CADENCE_NAME" ]; then
                    CADENCE_NAME="stable"
                  fi

                  if [ -z "$CADENCE_VERSION" ]; then
                    # Find the latest version for the specified cadence name (first match)
                    CADENCE_VERSION=$(echo "$SHIPPED" | sed -n "s/.*\"name\" *: *\"$CADENCE_NAME\"[^}]*\"version\" *: *\"\([^\"]*\)\".*/\1/p" | head -1)
                    echo "Resolved latest cadence version for $CADENCE_NAME: $CADENCE_VERSION"
                  fi

                  if [ -n "$CADENCE_VERSION" ]; then
                    RELEASES_EP="rel/$CADENCE_NAME/$CADENCE_VERSION"
                    RELEASES=$(curl -s --cert "$CERT_FILE" --cacert "$CA_FILE" \
                      "https://ses.sas.download/ses/$RELEASES_EP")
                    DU_LIST_EP=$(echo "$RELEASES" | sed -n 's/.*"latest".*"duList" *: *"\([^"]*\)".*/\1/p' | head -1)
                    if [ -n "$DU_LIST_EP" ]; then
                      LOD=$(curl -s --cert "$CERT_FILE" --cacert "$CA_FILE" \
                        "https://ses.sas.download/ses/$DU_LIST_EP")
                      IMAGE_TAG=$(echo "$LOD" | sed -n 's/.*"name" *: *"sas-analytics-pro"[^}]*"unitTag" *: *"\([^"]*\)".*/\1/p' | head -1)
                    fi
                  fi
                fi
                if [ -n "$IMAGE_TAG" ]; then
                  echo "Resolved latest stable tag: $IMAGE_TAG"
                else
                  echo "WARNING: Could not resolve latest tag, deployment will use chart appVersion"
                fi
              fi

              # Build the dockerconfigjson
              AUTH=$(printf "%s:%s" "$REG_USER" "$REG_PASS" | base64 | tr -d '\n')
              DOCKERCONFIG=$(printf '{"auths":{"cr.sas.com":{"auth":"%s"}}}' "$AUTH" | base64 | tr -d '\n')

              # Create or update the pull secret using the Kubernetes API
              NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              SECRET_NAME="{{ include "sas-analytics-pro.fullname" . }}-pull-secret"

              echo "Creating pull secret $SECRET_NAME in namespace $NAMESPACE..."

              # Check if secret exists
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                -H "Authorization: Bearer $TOKEN" \
                "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME")
              echo "Existing secret check returned HTTP $HTTP_CODE"

              SECRET_JSON="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET_NAME\",\"namespace\":\"$NAMESPACE\",\"annotations\":{\"sas.com/image-tag\":\"$IMAGE_TAG\"}},\"type\":\"kubernetes.io/dockerconfigjson\",\"data\":{\".dockerconfigjson\":\"$DOCKERCONFIG\"}}"

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Secret exists, updating..."
                RESULT=$(curl -s -w "\n%{http_code}" \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -X PUT \
                  -d "$SECRET_JSON" \
                  "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME")
              else
                echo "Secret does not exist, creating..."
                RESULT=$(curl -s -w "\n%{http_code}" \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST \
                  -d "$SECRET_JSON" \
                  "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/secrets")
              fi

              RESULT_CODE=$(echo "$RESULT" | tail -1)
              RESULT_BODY=$(echo "$RESULT" | sed '$d')

              if [ "$RESULT_CODE" -ge 200 ] && [ "$RESULT_CODE" -lt 300 ]; then
                echo "Pull secret created/updated successfully (HTTP $RESULT_CODE)"
              else
                echo "ERROR: Failed to create/update secret (HTTP $RESULT_CODE)"
                echo "$RESULT_BODY"
                exit 1
              fi

              # Store resolved image tag in a ConfigMap
              if [ -n "$IMAGE_TAG" ]; then
                CM_NAME="{{ include "sas-analytics-pro.fullname" . }}-image-tag"
                CM_JSON="{\"apiVersion\":\"v1\",\"kind\":\"ConfigMap\",\"metadata\":{\"name\":\"$CM_NAME\",\"namespace\":\"$NAMESPACE\"},\"data\":{\"imageTag\":\"$IMAGE_TAG\"}}"

                CM_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  -H "Authorization: Bearer $TOKEN" \
                  "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/configmaps/$CM_NAME")

                if [ "$CM_CODE" = "200" ]; then
                  curl -s -o /dev/null \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -X PUT -d "$CM_JSON" \
                    "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/configmaps/$CM_NAME"
                else
                  curl -s -o /dev/null \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -X POST -d "$CM_JSON" \
                    "https://kubernetes.default.svc/api/v1/namespaces/$NAMESPACE/configmaps"
                fi
                echo "Image tag ConfigMap stored: $IMAGE_TAG"
              fi

              rm -rf /tmp/certs
          volumeMounts:
            - mountPath: /certs/certs.zip
              name: certs
              subPath: certs.zip
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
  backoffLimit: 3
{{- end }}
