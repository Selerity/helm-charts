{{- if and .Values.sas.orderCertFile (not .Values.sas.registryPass) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "sas-analytics-pro.fullname" . }}-hook-certs
  labels:
    {{- include "sas-analytics-pro.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
data:
  certs.zip: {{ .Values.sas.orderCertFile | replace "\n" "" | replace " " "" }}
{{- end }}
